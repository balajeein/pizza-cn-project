# Extension C. On Mac 3 use port 3001; on Mac 4 change 3001 -> 3002.
# Load:     sudo pfctl -a com.apple/cnproject -f backend-pf.conf && sudo pfctl -E
# Show:     sudo pfctl -a com.apple/cnproject -s rules
# ROLLBACK: sudo pfctl -a com.apple/cnproject -F rules
# (Rules live in their own anchor, so /etc/pf.conf is never edited.)
# During Extension E, add a pass line for the standby edge's IP too.

pass  in quick on lo0 all                                   # local tests + standby nginx on same Mac
pass  in quick proto tcp from 10.7.13.223 to any port 3001  # only edge (Mac 2: 10.7.13.223) may reach the backend
block drop in quick proto tcp from any to any port 3001     # everyone else: silently dropped
