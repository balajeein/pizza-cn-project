# Primary DNS (Mac 1 - Pragya) and backup DNS (Mac 4 - Saransh) use this SAME file.
# Apple Silicon: /opt/homebrew/etc/dnsmasq.conf   Intel: /usr/local/etc/dnsmasq.conf
# Replace THIS_MAC_IP with the IP of the Mac running this file.

listen-address=127.0.0.1,THIS_MAC_IP
bind-interfaces

domain-needed                 # never forward names without a dot
bogus-priv                    # never forward private reverse lookups
local=/pizza.test/            # authoritative for pizza.test; never forward to internet
no-resolv                     # ignore /etc/resolv.conf
server=8.8.8.8                # upstream forwarders for public internet domains
server=1.1.1.1

# Project records live in a hosts-style file so they can be changed live (Extension B/E).
# Edit it, then: sudo killall -HUP dnsmasq   (reloads records without restart)
addn-hosts=/opt/homebrew/etc/team.hosts
local-ttl=30                  # TTL handed to clients for our records (Extension B)

log-queries                   # every query shows in the log — useful evidence
log-facility=/opt/homebrew/var/log/dnsmasq.log
